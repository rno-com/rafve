<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard — RAFVE</title><meta name="description" content="Demo pengelolaan katalog RAFVE."><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/admin.css"></head><body><header class="admin-top"><a class="wordmark" href="index.html">RAFVE<span>.</span></a><span>DEMO ADMIN</span><a href="index.html" class="text-link">← Kembali ke website</a></header><main class="admin-wrap"><div class="section-heading"><div><p class="eyebrow">STORE MANAGEMENT</p><h1>Dashboard</h1></div><button id="add-new" class="btn">+ Tambah produk</button></div><div id="stats" class="stats-grid"></div><nav class="admin-tabs"><button class="active" data-tab="products">Manajemen Produk</button><button data-tab="settings">Pengaturan Toko</button></nav><section id="admin-products"><div class="filters"><input id="admin-search" placeholder="Cari nama / ID produk"><select id="admin-category"><option value="">Semua kategori</option></select></div><div class="table-scroll"><table><thead><tr><th>Produk</th><th>ID</th><th>Kategori</th><th>Harga</th><th>Stok</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="admin-table"></tbody></table></div></section><section id="admin-settings" class="hidden"><form id="settings-form" class="admin-form"><label>Nama toko<input name="storeName" required></label><label>Tagline<input name="tagline"></label><label>Pesan pengumuman<input name="announcement"></label><label>Instagram URL<input name="instagram"></label><label>Nomor WhatsApp (format 62xxxxxxxxxx)<input name="whatsapp" inputmode="numeric" placeholder="Isi nomor resmi RAFVE"></label><label>Pesan pembuka WhatsApp<textarea name="greeting" rows="3"></textarea></label><label>Batas stok rendah<input name="lowStock" type="number" min="0" step="1"></label><label class="check-label"><input name="whatsappEnabled" type="checkbox"> Aktifkan pemesanan WhatsApp</label><button class="btn" type="submit">Simpan Pengaturan</button><p class="muted">Mode demo: pengaturan disimpan hanya di browser ini. Jangan memasukkan rahasia atau password.</p></form></section></main><dialog id="product-dialog"><form id="product-form" class="admin-form"><div class="section-heading"><h2 id="form-title">Tambah Produk</h2><button type="button" id="close-dialog" class="icon-btn" aria-label="Tutup">×</button></div><input type="hidden" name="originalId"><label>ID produk<input name="id" required></label><label>Nama produk<input name="name" required></label><label>Kategori<input name="category" required placeholder="Contoh: Dress"></label><label>Deskripsi<textarea name="description" rows="3"></textarea></label><div class="form-two"><label>Harga normal (Rp)<input name="price" type="number" min="0" required></label><label>Harga diskon (Rp)<input name="salePrice" type="number" min="0"></label></div><label>URL foto utama<input name="image" type="url" required placeholder="https://…"></label><div id="image-preview" class="image-preview">Preview foto akan tampil di sini</div><label>URL galeri (pisahkan dengan koma)<input name="gallery" placeholder="https://…, https://…"></label><label>Ukuran (pisahkan koma)<input name="sizes" required placeholder="S, M, L, XL"></label><label>Warna (pisahkan koma)<input name="colors" required placeholder="Black, Cream"></label><label>Stok total (demo)<input name="stock" type="number" min="0" step="1" required></label><label class="check-label"><input name="active" type="checkbox" checked> Produk aktif</label><label class="check-label"><input name="isNew" type="checkbox"> Label produk baru</label><button type="submit" class="btn">Simpan Produk</button></form></dialog><div id="toast" class="toast" role="status"></div><script src="assets/js/products.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/admin.js"></script></body></html>
